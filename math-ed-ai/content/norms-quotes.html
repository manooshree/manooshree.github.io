    <div class="quote">
      <!-- <p>I am not a Luddite &#8212; quite the opposite. I have used, and still use on a daily basis, AI as a bibliographic tool, to test random ideas, to speed up bureaucracy, as a helping hand with teaching, and so on. I do not use it to generate proofs, but I am not judgemental about people who do.</p>
      <p>However, I was genuinely pissed off by today’s announcement.</p>
      <p>To be fair, my first reaction was almost boredom. Yes, the AI has “proved” (really? Are we sure? Can we even understand what is written there?) a bunch of interesting results in my field. Not even a Millennium Problem. Pff.</p>
      <p>But the more I thought about it, the more annoyed I became. What bothers me most is the double standard.</p> -->
      <p> <span class="hl">Whenever I referee a paper, or receive a thesis or project from a student, I apply the same standards that most of us do. If a paper or thesis is so badly written that I cannot get past the first page without considerable effort, I reject it and ask for a new, readable version. </span></p>
      <p>With these AI-generated papers, I feel that we, as a community, are not applying the same standards of quality and rigour. They can simply release multiple 100+ page papers claiming to have solved this or that problem, often with redundant arguments, unclear logical structure, multiple dead ends, and strange or unsettling terminology &#8212; in other words, slop. And we are then expected to go through it, check it, clean it up, simplify it, and explain what is actually going on.</p>
      <p>This comes at a considerable cost to us in terms of time and effort, while they can simply move on and slop-bulldoze the next conjecture. And, of course, the credit remains theirs. In some sense, we are willingly contributing to our own demise.</p>
      <p> <span class="hl">I think the paradigm has to shift. We should apply to AI-generated mathematical announcements the same standards of rigour, clarity, and exposition that we demand from human-generated papers. Do you want the approval of the mathematical community? A badge of legitimacy? Then give us something that is actually readable and verifiable. If not, we should simply ignore it.</span></p>
      <p>In other words, I do not think that we, as a community, should spend our time cleaning up their mess in order to increase someone else’s commercial revenues.</p>
      <p>It is going to be difficult to win this game, but at the very least we can try to change the rules a little, so that the game is not completely skewed in their favour.</p>
      <cite>Enrico Fatighenti</cite>
    </div>
    <div class="quote">
      <p>I woke up this morning to an email of a collaborator informing me that Open AI announced a proof of Katok&#8217;s entropy conjecture, a three-decades old open problem which was the subject of my PhD and more generally the main motivation of my research.... Open AI claimed a proof of the conjecture in full generality this morning and my first impression was sadness to see my favorite problem get &#8220;killed&#8221; by AI ; it is definitely easier to ignore a problem when it does not affect you directly. Next, I felt stressed because I am currently applying for postdocs and more of my research plan was now obsolete and I spent the whole morning rewriting everything and sending emails to my advisors in panic. <span class="hl">Finally, I felt anger after opening the paper and observing that it was mostly unreadable slop.</span> The sane reaction would have just been to ignore the paper but I think I care too much about the problem to act as if it did not exist. The only conclusion I can make right now is that Open AI&#8217;s standards for mathematical publication is far too low and is harming mathematical research maybe in an irreversible way and that the mathematical community, motivated by genuine scientific curiosity, is accepting to work for free in order to &#8220;validate&#8221; these unreadable proofs.</p>
      <cite>Tristan Humbert</cite>
    </div>
    <div class="quote">

      <p><span class="hl">I have heard from colleagues in other areas of math that they consider some of the papers released to be &#8220;unreadable&#8221;.</span> There are also the issues of the perpetuating lack of human attribution, the lack of transparency and the apparent disregard of the advice of the advisory committee. It will take a long time for humans to absorb this new information, if it stands the test of time and rigorous scrutiny at all. If it doesn&#8217;t, then a lot of time is still likely to be wasted proofreading for the hole in the argument, which makes one wonder what is the point of it all. This is a mess.</p>
      <p>It makes me feel that the AI companies have chosen a side, and it is not the side that wants to work for the betterment of humanity (by trying to mitigate poverty, work on resource allocation, or trying to find a cure for serious diseases, for example) nor one that particularly cares. For the time being, I hope we do not give in to panic or a sense of doom.</p>
      <cite>Sahana Balasubramanya</cite>
    </div>
    <div class="quote">
      <p>Of course there was initial shock and dismay, both of the &#8220;why would they do this&#8221; and &#8220;how bad will this be for our community&#8221; variety, and marvel at progress on a couple very hard problems in my field. Then the realism after they somewhat mutedly withdrew some papers and fixed errors in others. I do not know how much of the progress came from creative novelty versus simply technical prowess, or how much they suppressed credit of ideas/contributions of mathematicians before them.</p>
      <p>Certainly I have no interest in reading these papers myself, and <span class="hl">think they should be expected to give good expositions &#8212; talks by humans, even! &#8212; rather than expect us to read slop if they want credit for advancing human understanding.</span> A Lean verification does not show the written proof is correct, and is definitely no indication that the manuscript or proof is good.</p>
      <p>Lastly, let me say that I am grateful for this site in current times.</p>
      <cite>Kimball Martin</cite>
    </div>
    <div class="quote">
      <p>We have reached a turning point, where no one can reasonably deny that AI has changed the nature of mathematics research. While <span class="hl">the contents of the 722 papers OpenAI dropped vary a lot in readability and quality</span>, many of them contain Field Medal worthy creative ideas. From this moment forward, doing serious mathematics research without using AI tools would be like insisting on computing integrals or large matrix factorizations by hand. We now have new powerful tools that will substantially accelerate the pace of progress at the frontier, and I am genuinely excited to see how they enhance our understanding.</p>
      <!-- <p>There are good questions about cost. I suspect it is still true that, per dollar spent, human research is the best bang for the buck… for now. But speed and scale are also factors. Even if some company had decided to spend a billion dollars on human mathematics researchers, there simply aren&#8217;t enough experts around, or enough hours in the day, to have produced anything like the progress OpenAI generated on the same time scale. This productivity gap will only grow now, and refusing to accept that our world has changed will not slow it down.</p>
      <p>This may be difficult to accept for many mathematicians whose sense of identity is tied up with hard problems they have solved or are working on solving. For me, this is not a fundamental change. I know and have interacted fruitfully with brilliant, highly productive, amazingly creative, and generous researchers who could probably solve over a long weekend any problem I&#8217;ve spent years trying to crack. That hasn&#8217;t stopped me from working on those problems, and the existence of AI tools that are leaps and bounds even more advanced shouldn&#8217;t deter any of us. The goal has always been human understanding of the beautiful web of ideas that is mathematics. While the way we contribute to that will change, the picture itself has not.</p>
      <p>Unfortunately, that sense of mathematical worth through solving hard problems has also formed the basis of our industry&#8217;s KPIs (Key Performance Indicators). Herein lies the real challenge, in my view. We must rethink everything: graduate admissions, thesis projects, hiring and tenure, major awards… our current KPIs lose much of their meaning in a world where AI-assisted / generated papers are everyone&#8217;s currency. Countless other industries are grappling with the same issue. We can use this forced opportunity to be thoughtful as a community as we redefine what it means to be a successful mathematician. But this is a daunting challenge. It will not be met equally by all departments or universities, and it will disproportionately affect the youngest most vulnerable members of our community the hardest.</p>
      <p>And that is no accident. While the contents of the &#8220;slop drop&#8221; are amazing, its method of delivery made it a weapon of math destruction.</p>
      <p>This is what &#8220;market disruption&#8221; looks like. It might just be a clash of incompatible corporate cultures, but I can&#8217;t shake the feeling that it is a targeted attack. OpenAI and Anthropic have behaved abhorrently and continue to deceive us at every turn. Their immediate goal is to extract value from us to bolster their IPOs, after which time we will be on our own. I believe we should devote all reasonable efforts and resources to competing with them, on our own terms. Along with resetting our entire industry, we must build our own LLM models (and infrastructure to run them). We want these powerful tools to be accessible to everyone, not just those who kiss the Noetherian Ring of our new corporate overlords.</p> -->
      <cite>Todd Kemp</cite>
    </div>
    <div class="quote">
      <p>I am very excited about the future. I know that there is chaos today. We are in the eye of the storm. We do not want to read slop papers. Some of the OpenAI papers have already been retracted. We do not yet even know what is true. But I believe that truth and understanding will bubble to the top. <span class="hl">There are plenty of important poorly-written papers by humans &#8212; bad exposition has always been with us</span>, and mathematicians have offered translation services for free many times before. AI will get better at explaining. Mathematics has undoubtedly moved forwards this week &#8212; this cannot be denied.</p>
      <cite>Kevin Buzzard</cite>
    </div>
    <div class="quote">
      <!-- <p>Although I had heard rumors about these results, the range of proofs are stunning, solving problems in geometric group theory and topology that I might not have expected to be resolved in my lifetime (assuming they get checked to be correct). I would be especially happy if all of the results are eventually formalized, since it would require formalization of some of my work and the literature it relies on.</p> -->
      <p>I (and others) have observed that there is some analogy to the proof of the Poincaré/Geometrization conjecture by Perelman. He posted his preprints after a 7 year hiatus from the mathematics community, and gave a couple of talks, but otherwise made no effort to disseminate the results. For most mathematicians, the preprints were very hard to read, and it took several groups many years to fill in the details (although the experts gave all of the credit of ideas to Perelman in the end). These results might have a similar assimilation into the mathematics community.</p>
      <p>I feel like the French mathematics community may be better equipped to deal with these developments, since <span class="hl">they have a tradition of valuing mathematical exposition</span>, eg the Bourbaki seminar (and its publication Astérisque), and the journal l’Enseignement Mathématique. Maybe this is a model for how the wider mathematical community can behave.</p>
      <!-- <p>After many big new developments in mathematics, once the community has understood the result, there are usually people that make clever new applications of the results, or build on them in highly non-trivial ways to make progress on related problems. For example, I spent much time learning about Perelman’s work, and from this was able to make some applications beyond the Geometrization conjecture applying his techniques. I expect this to happen with this OpenAI drop &#8211; mathematicians are clever, and will find simplifications and applications of these results (I am already hearing about this happening). For young people, this may be a good opportunity to learn some cutting edge mathematics.</p> -->
      <cite>Ian Agol</cite>
