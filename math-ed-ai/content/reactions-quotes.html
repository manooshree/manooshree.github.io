
<figure class="quote-pair">
<div class="quote-col">
<div class="quote-box quotes-green">
    <div class="quote">
      <p>I am very excited about the future. I know that there is chaos today. We are in the eye of the storm. We do not want to read slop papers. Some of the OpenAI papers have already been retracted. We do not yet even know what is true. But I believe that truth and understanding will bubble to the top. There are plenty of important poorly-written papers by humans — bad exposition has always been with us, and mathematicians have offered translation services for free many times before. AI will get better at explaining. Mathematics has undoubtedly moved forwards this week — this cannot be denied.</p>
      <cite>Kevin Buzzard</cite>
    </div>
    <div class="quote">
      <p>I am optimistic, because I see little to gain from pessimism. Still, I was stunned by the claimed solution to determining the dimension of self-similar measures on the line (Item 148 in the Review) and related problems. I am heartened that the proof appears to stand on the shoulders of earlier mathematicians and live within the framework they developed. I will spend more time studying it; after all, I believe human understanding and explanation are essential to progress in our community. They also bring joy, though perhaps not the same intense joy as a eureka moment.</p>
      <!-- <p>I do not know how these problems were selected, but their impact makes me wonder: what makes a mathematical problem important or interesting? Problems drive progress, and posing good ones requires vision and taste, often developed through years of exploration. Knowing their definitive answers is always fantastic, but what comes next?</p>
      <p>This announcement reveals AI’s capacity to “do” mathematics at massive scale and with rble depth. Is it possible to build an interactive mathematical world (perhaps a Google Map of math) where we can visually explore ideas, navigate proofs, and uncover connections between different fields? AI could help build it, guided by human mathematicians’ expertise. Future mathematicians could use their creativity and insight to expand this world, enrich its details, and find new questions worth pursuing.</p> -->
      <cite>Zhou Feng</cite>
    </div>
    <div class="quote">
      <p>I find the new results from OpenAI to be wonderful! This is an extremely exciting time to be a mathematician. Clearly this is a period of significant disruption, and we need to restructure our institutions and rethink many of our practices for this new age of “proof abundance”. But we are learning a lot more mathematics than ever before, and humans and AI working together will propel both beautiful pure mathematics and useful applied mathematics to new heights. Props to Will DePue for his wonderful website citedbyagi.com showcasing how AI stood on the shoulders of human mathematicians.</p>
      <cite>Ryan Alweiss</cite>
    </div>
    <div class="quote">
      <p>There are questions to ask, things to discuss about the how and why, and criticisms to make. At the same time, I hope we can also recognize what an extraordinary achievement and breakthrough these results are. They are the collective achievement of generations of mathematicians: the questions they asked, the theories they developed and the ideas they shared. I am looking forward to understanding the new mathematics and seeing where it leads us as a human mathematical community.</p>
      <cite>Thomas Nikolaus</cite>
    </div>
</div>
<p class="quote-caption">Optimistic reactions</p>
</div>
<div class="quote-col">
<div class="quote-box quotes-purple">
    <div class="quote">
      <p>The announcement was the first thing I saw in the morning. My immediate reaction was just to laugh, I’m not really sure what I felt. A combination of disgust, grief, and apathy maybe. Digesting machine arguments will not offer us the same depth of understanding, expertise, intuition, and fulfillment that we find in working on our own problems for months and often years, and sharing our work with others. I worry about the future of research mathematics and my place in it. I hope we can adopt healthy norms. I am not interested in paying morally depraved tech giants &gt;100€/month to become a professional button-pushing slop digester.</p>
      <cite>Sam Fisher</cite>
    </div>
    <div class="quote">
      <p>Today, something is lost forever. We were explorers of uncharted theorems, fine goldsmiths of beautiful proofs. Humanity was alone in the fantastic world of the mind, where crystalline cohomology was as concrete as a gothic cathedral. Today the machine came.</p>
      <p>She claims to have solved a lot of our questions with its thunderous answer “42!”. She is quicker than us, knows everything humanity has ever done and gives us answers a few moments after we make the question.</p>
      <p>What is left for us is to be priests of the Machine-God, heeding her words, understanding them for our fellow humans.</p>
      <p>I fear the future of the mind will be a desert, with no questions to guide us beyond the horizon.</p>
      <cite>Giovanni Mongardi</cite>
    </div>
    <div class="quote">
      <p>I was one of the many people devastated by the OpenAI announcement—to me, it felt like a real stab in the back. Now, I feel like I’m standing among ruins ; questions that guided 46 years of my career, feel suddenly wiped out. My biggest worry right now is for younger mathematicians. How are we supposed to convince undergrads to pursue a math PhD? How do we tell postdocs that staying in academia is still worth it? How do we convince funding agencies to keep supporting math research?</p>
      <p>Right now I’m at the IHP in Paris, where people are organizing reading seminars just to try to make sense of those AI breakthroughs. I hesitantly agreed to take part in an online seminar on constructing non-sofic groups, but I keep coming back to one question I can’t answer: most of us are publicly funded, so why should we be providing free expert feedback to a secretive company that ignores our community’s basic rules? A song by The Doors is running through my head:</p>
      <p>« Strange days have found us<br>
      s have tracked us down<br>
      They’re going to destroy<br>
      Our casual joys<br>
      We shall go on playing<br>
      Or find a new town »</p>
      <cite>Alain Valette</cite>
    </div>
    <div class="quote">
      <p>One of the papers is a solution to the Bass trace conjecture, a beautiful conjecture made by Hyman Bass in 1976, implying the older idempotent conjecture (from the 50ies maybe?) that there should be non non-trivial idempotent in the group ring of a torsion-free group. I was privileged enough to have given a proof for amenable groups 25 years ago with two amazing collaborators, Jon Berrick and Guido Mislin, that changed my career and my vision of life and of mathematics. For years now, progress on this question remained incremental and we all did other stuff.</p>
      <p>I don’t understand the proof, and I still don’t believe that this conjecture could be true in general. The paper is 30 pages long and looks like slop -lean certified, whatever that means. However I am looking forward to a small group of colleagues to go through it and either shred it to pieces or understand a stunningly beautiful argument. Who’s in?</p>
      <p>3 papers have been pulled already… Is it time to claim that it’s us, that lean is unreliable (and demand money to say otherwise)?</p>
      <cite>Indira Chatterji</cite>
    </div>
</div>
